<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SocialApp - Profile</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            SocialApp
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="profile.html">
                Profile
            </a>

            <button onclick="logout()">
                Logout
            </button>

        </div>

    </nav>


    <!-- Profile -->
    <main class="container">

        <section class="profile-card">

            <div class="profile-avatar">
                👤
            </div>

            <h1 id="profileUsername">
                Loading...
            </h1>

            <p
                id="profileEmail"
                class="profile-email"
            >
                Loading...
            </p>

            <p
                id="profileBio"
                class="profile-bio"
            >
                Loading...
            </p>


            <!-- Followers / Following -->
            <div class="profile-stats">

                <div>
                    <strong id="followersCount">
                        0
                    </strong>

                    <span>
                        Followers
                    </span>
                </div>

                <div>
                    <strong id="followingCount">
                        0
                    </strong>

                    <span>
                        Following
                    </span>
                </div>

            </div>

        </section>


        <!-- Edit Profile -->
        <section class="edit-profile">

            <h2>
                Edit Profile
            </h2>

            <input
                type="text"
                id="editUsername"
                placeholder="New username"
            >

            <textarea
                id="editBio"
                placeholder="Write your bio..."
            ></textarea>

            <button
                class="primary-btn"
                onclick="updateProfile()"
            >
                Update Profile
            </button>

        </section>

    </main>


    <script src="js/profile.js"></script>

</body>

</html>
