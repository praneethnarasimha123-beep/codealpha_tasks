<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SocialApp - Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body class="auth-page">

    <div class="auth-box">

        <h1>SocialApp</h1>

        <h2>Login</h2>

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button
            class="primary-btn"
            onclick="login()"
        >
            Login
        </button>

        <p>
            Don't have an account?
            <a href="signup.html">Create Account</a>
        </p>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
